<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
  >

  <title>歌仔戲 AR 臉譜</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR Face Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      position: fixed;
      inset: 0;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }

    canvas {
      background: transparent !important;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;

      padding: 10px 18px;

      background: rgba(0, 0, 0, 0.55);
      color: #ffffff;

      border-radius: 30px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 16px;
      line-height: 1;

      white-space: nowrap;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="message">
    將臉對準鏡頭
  </div>

  <a-scene
    mindar-face="autoStart: true"
    embedded
    renderer="
      alpha: true;
      antialias: true;
      colorManagement: true;
      physicallyCorrectLights: false;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>
      <img
        id="faceTexture"
        src="./face.png"
        crossorigin="anonymous"
      >
    </a-assets>

    <a-camera
      active="false"
      position="0 0 0"
      look-controls="enabled: false"
    >
    </a-camera>

    <a-entity
      mindar-face-target="anchorIndex: 168"
    >

      <a-plane
        src="#faceTexture"
        position="0 -0.10 0.05"
        width="1.05"
        height="1.35"
        material="
          shader: flat;
          transparent: true;
          alphaTest: 0.01;
          side: double;
          depthTest: false;
        "
      >
      </a-plane>

    </a-entity>

  </a-scene>

</body>

</html>
