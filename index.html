<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>歌仔戲 AR 臉譜</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR Face Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;

      padding: 10px 18px;

      background: rgba(0, 0, 0, 0.6);
      color: white;

      border-radius: 30px;

      font-family: Arial, sans-serif;
      font-size: 16px;

      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="message">
    將臉對準鏡頭
  </div>

  <a-scene
    mindar-face
    embedded
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <!-- 載入你的歌仔戲臉譜 -->
    <a-assets>
      <img
        id="faceTexture"
        src="./face.png"
        crossorigin="anonymous"
      >
    </a-assets>

    <!-- 手機相機 -->
    <a-camera
      active="false"
      position="0 0 0"
    ></a-camera>

    <!-- 臉部追蹤 -->
    <a-entity
      mindar-face-target="anchorIndex: 168"
    >

      <!-- 臉譜 -->
      <a-plane
        src="#faceTexture"
        position="0 -0.1 0.05"
        width="1.05"
        height="1.35"
        material="
          transparent: true;
          alphaTest: 0.01;
          side: double;
        "
      >
      </a-plane>

    </a-entity>

  </a-scene>

</body>

</html>
