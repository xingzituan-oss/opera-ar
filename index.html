<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
  >

  <title>歌仔戲 AR 臉譜</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }

    canvas {
      background: transparent !important;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;

      padding: 8px 15px;
      border-radius: 30px;

      background: rgba(0,0,0,0.55);
      color: white;

      font-size: 14px;
      white-space: nowrap;
      pointer-events: none;
    }

    #controls {
      position: fixed;
      z-index: 99999;

      left: 50%;
      bottom: max(25px, env(safe-area-inset-bottom));

      transform: translateX(-50%);

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    button {
      width: 55px;
      height: 48px;

      border: none;
      border-radius: 15px;

      background: rgba(0,0,0,0.65);
      color: white;

      font-size: 22px;
      font-weight: bold;

      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.92);
    }

    .sizeButton {
      width: 85px;
      font-size: 16px;
    }

    #values {
      background: rgba(0,0,0,0.65);
      color: white;

      padding: 6px 12px;
      border-radius: 20px;

      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="message">
    將臉對準鏡頭
  </div>

  <a-scene
    mindar-face="autoStart: true"
    embedded
    renderer="alpha: true; antialias: true; colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>
      <img
        id="faceTexture"
        src="./face.png"
        crossorigin="anonymous"
      >
    </a-assets>

    <a-camera
      active="false"
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>


    <!-- 臉部追蹤 -->
    <a-entity mindar-face-target="anchorIndex: 168">

      <a-plane
        id="mask"
        src="#faceTexture"

        position="0 -0.20 0.05"

        width="0.95"
        height="1.22"

        material="
          shader: flat;
          transparent: true;
          alphaTest: 0.01;
          side: double;
          depthTest: false;
        "
      ></a-plane>

    </a-entity>

  </a-scene>


  <!-- 調整控制器 -->
  <div id="controls">

    <div id="values">
      位置 X：0.00　Y：-0.20　大小：1.00
    </div>

    <div class="row">
      <button onclick="moveMask(0, 0.02)">↑</button>
    </div>

    <div class="row">

      <button onclick="moveMask(-0.02, 0)">←</button>

      <button onclick="moveMask(0, -0.02)">↓</button>

      <button onclick="moveMask(0.02, 0)">→</button>

    </div>

    <div class="row">

      <button
        class="sizeButton"
        onclick="resizeMask(0.95)"
      >
        － 縮小
      </button>

      <button
        class="sizeButton"
        onclick="resizeMask(1.05)"
      >
        ＋ 放大
      </button>

    </div>

  </div>


  <script>

    let x = 0;
    let y = -0.20;
    let scale = 1;

    const baseWidth = 0.95;
    const baseHeight = 1.22;


    function moveMask(dx, dy) {

      x += dx;
      y += dy;

      updateMask();

    }


    function resizeMask(amount) {

      scale *= amount;

      updateMask();

    }


    function updateMask() {

      const mask = document.getElementById("mask");

      mask.setAttribute(
        "position",
        `${x} ${y} 0.05`
      );

      mask.setAttribute(
        "width",
        baseWidth * scale
      );

      mask.setAttribute(
        "height",
        baseHeight * scale
      );

      document.getElementById("values").innerHTML =
        `位置 X：${x.toFixed(2)}　Y：${y.toFixed(2)}　大小：${scale.toFixed(2)}`;

    }

  </script>

</body>

</html>
